name: Props Sync
on:
  schedule:
    # Hourly — props use external API credits, no need for frequent polling
    - cron: "0 * * * *"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync props
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/props/sync" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json") || true
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Props sync response (HTTP $HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Props sync returned HTTP $HTTP_CODE: $BODY"
          fi
      - name: Backfill missing player headshots
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/props/backfill" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json") || true
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Backfill response (HTTP $HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Backfill returned HTTP $HTTP_CODE: $BODY"
          fi
