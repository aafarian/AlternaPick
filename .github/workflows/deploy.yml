name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/deploy/alternapick

            # Ensure DNS is working (fix if broken)
            if ! host github.com > /dev/null 2>&1; then
              echo "DNS resolution failed, adding fallback nameservers..."
              echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" | sudo tee /etc/resolv.conf > /dev/null
              sleep 2
            fi

            # Pull with retry
            for i in 1 2 3; do
              echo "git pull attempt $i..."
              if git pull origin main; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "git pull failed after 3 attempts"
                exit 1
              fi
              echo "Retrying in 10s..."
              sleep 10
            done

            # Write .env from secrets
            cat > .env << 'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}
            SYNC_SECRET=${{ secrets.SYNC_SECRET }}
            DOMAIN=${{ secrets.DOMAIN }}
            ENVEOF

            # Build new images WHILE old containers still serve traffic
            docker compose build

            # Stop old containers and start new ones
            docker compose down --remove-orphans
            docker compose up -d

            # Health check with rollback
            echo "Waiting for app to start..."
            sleep 5
            healthy=false
            for i in 1 2 3 4 5; do
              if curl -sf --max-time 5 http://localhost:3000 > /dev/null 2>&1; then
                echo "Health check passed!"
                healthy=true
                break
              fi
              echo "Health check attempt $i failed, retrying in 5s..."
              sleep 5
            done

            if [ "$healthy" = false ]; then
              echo "ROLLBACK: Health check failed, restarting containers..."
              docker compose down
              docker compose up -d
              sleep 10
              if ! curl -sf --max-time 5 http://localhost:3000 > /dev/null 2>&1; then
                echo "CRITICAL: Rollback failed — manual intervention needed"
                exit 1
              fi
              echo "Rollback succeeded — containers recovered"
            fi

            # Clean up old images
            docker image prune -f
