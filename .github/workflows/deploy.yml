name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/deploy/alternapick

            # Ensure DNS is working (fix if broken)
            if ! host github.com > /dev/null 2>&1; then
              echo "DNS resolution failed, adding fallback nameservers..."
              echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" | sudo tee /etc/resolv.conf > /dev/null
              sleep 2
            fi

            # Pull with retry
            for i in 1 2 3; do
              echo "git pull attempt $i..."
              if git pull origin main; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "git pull failed after 3 attempts"
                exit 1
              fi
              echo "Retrying in 10s..."
              sleep 10
            done

            # Write .env from secrets
            cat > .env << 'ENVEOF'
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}
            SYNC_SECRET=${{ secrets.SYNC_SECRET }}
            DOMAIN=${{ secrets.DOMAIN }}
            FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            EMAIL_ALLOWLIST=${{ secrets.EMAIL_ALLOWLIST }}
            UNSUBSCRIBE_SECRET=${{ secrets.UNSUBSCRIBE_SECRET }}
            RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}
            ENVEOF

            # Tag current locally-built images so we can rollback if the new build fails health checks
            # (caddy uses a pre-built Docker Hub image, so no need to tag it)
            for svc in nextjs stats-service; do
              img=$(docker compose images $svc --format '{{.Repository}}:{{.Tag}}' 2>/dev/null | head -1)
              if [ -n "$img" ] && [ "$img" != ":" ]; then
                docker tag "$img" "${img%%:*}:rollback" 2>/dev/null || true
              fi
            done

            # Build new images WHILE old containers still serve traffic
            docker compose build

            # Zero-downtime restart: recreate containers one at a time.
            # Old containers keep serving until the new ones pass health checks.
            # --no-deps prevents cascading restarts of dependent services.
            # Failures are caught here (not via set -e) so rollback can run.
            healthy=true
            docker compose up -d --no-deps --wait stats-service || { echo "stats-service failed healthcheck"; healthy=false; }
            docker compose up -d --no-deps --wait nextjs       || { echo "nextjs failed healthcheck";       healthy=false; }
            docker compose up -d --remove-orphans

            # Verify the deploy via the health endpoint
            if [ "$healthy" != "false" ]; then
              echo "Verifying deploy via /api/health..."
              sleep 3
              healthy=false
              for i in 1 2 3 4 5; do
                if curl -sf --max-time 5 http://localhost/api/health > /dev/null 2>&1; then
                  echo "Health check passed!"
                  healthy=true
                  break
                fi
                echo "Health check attempt $i failed, retrying in 5s..."
                sleep 5
              done
            fi

            if [ "$healthy" = false ]; then
              echo "ROLLBACK: Health check failed, restoring previous images..."
              for svc in nextjs stats-service; do
                img=$(docker compose images $svc --format '{{.Repository}}' 2>/dev/null | head -1)
                if [ -n "$img" ] && docker image inspect "${img}:rollback" > /dev/null 2>&1; then
                  docker tag "${img}:rollback" "${img}:latest"
                fi
              done
              docker compose up -d --force-recreate --wait nextjs stats-service
              sleep 3
              rollback_ok=false
              for i in 1 2 3 4 5; do
                if curl -sf --max-time 5 http://localhost/api/health > /dev/null 2>&1; then
                  echo "Rollback succeeded — restored previous images"
                  rollback_ok=true
                  break
                fi
                echo "Rollback health check attempt $i failed, retrying in 5s..."
                sleep 5
              done
              if [ "$rollback_ok" = false ]; then
                echo "CRITICAL: Rollback failed — manual intervention needed"
                exit 1
              fi
              exit 1  # Deploy failed even though rollback recovered the site
            fi

            # Clean up rollback tags and old images
            for svc in nextjs stats-service; do
              img=$(docker compose images $svc --format '{{.Repository}}' 2>/dev/null | head -1)
              if [ -n "$img" ]; then
                docker rmi "${img}:rollback" 2>/dev/null || true
              fi
            done
            docker image prune -f
