name: Game Sync & Resolution
on:
  schedule:
    # Every 10 minutes, 24/7 — covers all sports in all timezones
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync props (respects 2h cache TTL)
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/props/sync" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json" || true
      - name: Sync game statuses & resolve cards
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/games/sync-status" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json"
